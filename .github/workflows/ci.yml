name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Packages and tests target net8.0 and net10.0, so tests run on both runtimes.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      # The Tooling sample's output is committed. Regenerate it and fail when it changed,
      # so documentation, contract file and example configuration never drift from the code.
      - name: Tooling sample output is up to date
        run: |
          dotnet run --project samples/Leander.Configuration.Tooling.Sample --no-build --configuration Release
          git add --intent-to-add samples/Leander.Configuration.Tooling.Sample/output
          git diff --exit-code -- samples/Leander.Configuration.Tooling.Sample/output
